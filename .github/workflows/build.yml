name: build-win64

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for publishing a release on tags

jobs:
  win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile resources
        shell: cmd
        run: rc /nologo /fo ScannerAPIGateway.res src\ScannerAPIGateway.rc

      - name: Build (x64, static CRT)
        shell: cmd
        run: >
          cl /nologo /std:c++17 /EHsc /O2 /MT /W4 /utf-8 /guard:cf
          /DUNICODE /D_UNICODE
          src\ScannerAPIGateway.cpp ScannerAPIGateway.res
          /Fe:ScannerAPIGateway.exe
          /link /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /guard:cf

      - name: Smoke test
        shell: pwsh
        run: |
          ./ScannerAPIGateway.exe version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          ./ScannerAPIGateway.exe scan --dpi 5
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2 for invalid arguments, got $LASTEXITCODE" }
          ./ScannerAPIGateway.exe scan --blank-skip 2
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2 for invalid --blank-skip, got $LASTEXITCODE" }
          ./ScannerAPIGateway.exe list --backends twain
          if ($LASTEXITCODE -ne 0) { throw "list --backends twain should succeed even without a DSM, got $LASTEXITCODE" }

      - name: Checksum
        shell: pwsh
        run: |
          (Get-FileHash ScannerAPIGateway.exe -Algorithm SHA256).Hash.ToLower() + "  ScannerAPIGateway.exe" | Out-File -Encoding ascii ScannerAPIGateway.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ScannerAPIGateway-win-x64
          path: |
            ScannerAPIGateway.exe
            ScannerAPIGateway.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScannerAPIGateway.exe
            ScannerAPIGateway.exe.sha256
